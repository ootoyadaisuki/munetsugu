<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>村上宗嗣の12時間</title>
<style>
  :root {
    --bg: #0d0f14; --panel: #161a22; --line: #2a3140; --text: #e8e4d8;
    --dim: #8a8f9a; --gold: #f0c33c; --green: #7ee081; --red: #ff6b6b; --blue: #6bb8ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Hiragino Kaku Gothic ProN", "BIZ UDGothic", Meiryo, monospace;
    display: flex; justify-content: center; overflow: hidden;
    image-rendering: pixelated;
  }
  #app { width: min(100vw, 480px); height: 100%; display: flex; flex-direction: column; position: relative; }

  #hud {
    padding: 6px 14px 5px; border-bottom: 2px solid var(--line); background: var(--panel);
    font-variant-numeric: tabular-nums; flex-shrink: 0;
  }
  /* 左に本数、右に金額。金額は 総売上 → 史実まで の順で縦に並ぶ */
  /* 左に本数を2段、右に金額を2段。左右の縦幅が揃う */
  .hud-top { display: flex; align-items: center; gap: 8px; white-space: nowrap;
    padding-right: 38px; }   /* 右上の☰のぶんを空ける */
  .hud-counts { display: flex; flex-direction: column; gap: 1px; font-size: 10px; }
  .hud-money { margin-left: auto; display: flex; flex-direction: column;
    align-items: flex-end; gap: 1px; }
  .hud-sales-row { display: flex; align-items: baseline; gap: 6px; }
  .hud-sales-label { color: var(--gold); font-size: 16px; font-weight: bold; }
  #hud-sales { color: var(--gold); font-size: 18px; font-weight: bold; }
  #hud-buyers, #hud-upsell { color: var(--gold); }
  /* 見込み客＝体力ゲージ。解除のたびに削れていく */
  .hud-gauge-row { display: flex; align-items: center; gap: 8px; margin-top: 3px;
    font-size: 10.5px; color: var(--dim); white-space: nowrap; }
  /* 減った分（＝解除と購入で抜けた人）が赤く残る体力ゲージ */
  .gauge { flex: 1; height: 9px; background: #7a2f2f; border: 1px solid var(--line);
    overflow: hidden; }
  .gauge.draining { background: var(--red); }
  #gauge-fill { height: 100%; width: 100%; background: #3f7fd0; }   /* 見込み客＝青 */
  /* メンタル＝自分を焼いたか。見込み客ゲージと対になる */
  #gauge-mental { background: #7a2f2f; }
  #mental-fill { height: 100%; width: 100%; background: var(--green); }
  /* メンタル・信用・顧客理解を1行に。この3つがアップセル＝売上の9割を動かす。
     4本とも別の色にして、ラベルの文字色もバーに合わせる＝34pxでも取り違えない */
  .hud-trio { gap: 5px; }
  .hud-trio .gauge { min-width: 34px; }
  .g-list { color: #6ba4e8; }
  .g-mental { color: var(--green); }
  .g-trust { color: #f09a3c; }
  .g-rikai { color: #c79ceb; }
  /* 信用・顧客理解も70%から始まって上下する。削れたぶんは他と同じく赤で残る */
  #gauge-trust, #gauge-rikai { background: #7a2f2f; }
  #trust-fill { height: 100%; width: 70%; background: #f09a3c; }   /* 信用＝橙 */
  #rikai-fill { height: 100%; width: 70%; background: #b58ce0; }   /* 顧客理解＝紫 */
  #hud-remain { color: var(--blue); font-size: 11px; }
  #hud-remain.gold { color: var(--gold); font-weight: bold; }
  /* 残り時間はドット絵の下。ここが一番目に入る */
  #timebar { padding: 4px 14px; text-align: center; background: #11151d;
    border-bottom: 2px solid var(--line); flex-shrink: 0; }
  /* 画面のいちばん右上。金枠でHUDの数字から独立させる */
  #menu-btn { position: absolute; top: 4px; right: 6px; z-index: 15;
    background: var(--panel); border: 2px solid var(--gold); color: var(--gold);
    font-size: 15px; font-weight: bold; line-height: 1; padding: 6px 9px;
    cursor: pointer; font-family: inherit; border-radius: 3px; }
  #menu-btn:active { background: var(--gold); color: var(--panel); }
  .menu-pop { position: absolute; inset: 0; background: rgba(8, 10, 16, .9); z-index: 20;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    gap: 12px; padding: 0 32px; }
  .menu-pop .choice { width: 100%; max-width: 260px; text-align: center; }
  #hud-clock { font-size: 15px; font-weight: bold; letter-spacing: 1px; color: var(--gold); }
  #hud-clock.urgent { color: var(--red); }
  body.flash-red #app { animation: redflash .7s; }
  @keyframes redflash { 0% { background: #3a1010; } 100% { background: var(--bg); } }
  .choice-label { font-size: 12px; color: var(--dim); letter-spacing: 1px; padding: 0 2px 2px; }
  .send-wrap { text-align: center; margin-top: 4vh; display: flex; flex-direction: column; gap: 12px; }
  .send-subject { font-size: 16px; font-weight: bold; }
  .send-state { color: var(--dim); font-size: 13px; }
  .send-open { font-size: 18px; color: var(--text); font-variant-numeric: tabular-nums; }
  .send-buy { font-size: 18px; color: var(--gold); font-weight: bold; font-variant-numeric: tabular-nums; }
  .send-unsub { font-size: 18px; color: var(--red); font-weight: bold; font-variant-numeric: tabular-nums; }
  .send-upsell { font-size: 18px; color: var(--gold); font-weight: bold; font-variant-numeric: tabular-nums; }
  /* 💀を踏んだ通の注記。結果が落ちた理由をその場で言う */
  .send-kill { color: var(--red); font-size: 12px; margin-top: 6px; }
  /* 本数の右に金額。フロント10万円とアップセル200万円の差をここで見せる。
     色を分けると片方が格下に見えるので、2行とも同じ金色にする */
  .send-yen { font-size: 13px; font-weight: normal; color: #d8a83c; margin-left: 8px; }
  /* メンタルの増減は必ず数字で出す */
  .mental-tag { font-size: 15px; font-weight: bold; text-align: center; margin-top: 8px; }
  .mental-tag .down { opacity: .95; }
  .mental-tag .up { opacity: 1; }
  .send-mental .mental-tag { margin-top: 0; }
  .send-sales { font-size: 21px; color: var(--gold); font-weight: bold; margin-top: 10px;
    padding-top: 12px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .mail-subj { font-size: 13px; color: #333; border-bottom: 1px solid #ccc;
    padding-bottom: 6px; margin-bottom: 10px; }
  .mail-text { font-size: 15px; line-height: 1.6; }
  .unsub-voice .tline { color: #d9a0a0; }
  .sogo { font-size: 20px; margin-bottom: 8px; }
  .sogo-rank { font-size: 30px; font-weight: bold; color: var(--gold); }

  #artwrap { position: relative; flex-shrink: 0; display: none; }
  #art { width: 100%; height: auto; max-height: 24vh; object-fit: contain;
    image-rendering: pixelated; display: block; border-bottom: 2px solid var(--line);
    background: #0b0e16; }
  #stage { flex: 0 1 auto; padding: 14px 16px; overflow-y: auto; position: relative; min-height: 0; }
  #choices { padding: 4px 14px 8px; display: flex; flex-direction: column; gap: 7px;
    flex-shrink: 0; }
  #spacer { flex: 1; min-height: 0; }

  .textbox { line-height: 1.9; font-size: 15px; }
  .tline { min-height: 1.4em; white-space: pre-wrap; }
  .center { text-align: center; margin-top: 8vh; }
  .dim { color: #c9c5ba; }
  .tag { color: var(--dim); font-size: 12px; margin-top: 6px; }
  .taphint { position: absolute; bottom: 8px; right: 16px; color: var(--dim); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .2; } }

  .choice {
    background: var(--panel); border: 2px solid var(--line); color: var(--text);
    padding: 10px 13px; font-size: 14px; text-align: left; line-height: 1.5;
    cursor: pointer; font-family: inherit; border-radius: 2px;
  }
  .choice:active { background: #222a38; border-color: var(--gold); }
  /* 👑＝小ネタで正解したときだけ出る特別な選択肢 */
  .choice.crown { border-color: var(--gold); background: #1e1c14; }
  /* メンタル30未満では👑にも💀が付く。安全に見えないほうを優先して塗る */
  .choice.crown.kill { border-color: #6b2a2a; background: #1a1512; color: #c9b7b7; }
  /* 💀＝いまのメンタルでは特に刺さる選択肢。疲れるほど増える */
  .choice.kill { border-color: #6b2a2a; background: #170f12; color: #c9b7b7; }
  /* 直前のタップが選択肢に貫通するのを防ぐ一瞬の無効時間 */
  #choices.guard .choice { pointer-events: none; }
  .choice.redo { background: none; border-style: dashed; color: var(--dim);
    font-size: 13px; text-align: center; padding: 7px; }
  .choice.next-btn { text-align: center; width: 160px; align-self: center; }
  /* 締めの画面のボタン。ここだけは見落とされないように金枠で立てる */
  .choice.top-btn { width: 200px; border-color: var(--gold); color: var(--gold);
    font-weight: bold; padding: 13px; margin-top: 12px; }
  .choice.top-btn:active { background: var(--gold); color: var(--panel); }

  .title-wrap { text-align: center; margin-top: 4vh; display: flex; flex-direction: column; gap: 18px; align-items: center; }
  .game-title { font-size: 30px; font-weight: bold; letter-spacing: 4px; color: var(--gold);
    text-shadow: 3px 3px 0 #4a3a08; }
  .game-sub { color: var(--dim); letter-spacing: 2px; }
  .legend { font-size: 11px; color: var(--dim); margin-top: 10px; }
  .start { width: 200px; text-align: center; margin-top: 24px; }

  .record-wrap, .noon-wrap { text-align: center; margin-top: 6vh; display: flex; flex-direction: column; gap: 12px; }
  .rec-label { color: var(--dim); letter-spacing: 3px; transition: opacity 1.4s; }
  .rec-label.fadeout { opacity: 0; }
  .rec-num { font-size: 34px; font-weight: bold; color: var(--gold); font-variant-numeric: tabular-nums; }
  .rec-num.small { font-size: 28px; }
  .rec-challenge { margin-top: 18px; font-size: 16px; }
  .noon-diff { color: var(--red); font-size: 18px; font-weight: bold; }

  .lp-mock { border: 2px solid var(--line); background: #fff; color: #222; padding: 14px;
    display: flex; gap: 10px; align-items: center; margin-bottom: 18px; }
  .lp-video { background: #222; color: #fff; padding: 28px 20px; font-size: 13px; }
  .lp-btn { background: #d33; color: #fff; padding: 12px 16px; font-weight: bold; font-size: 13px; }

  .blackout, .blackout-full { position: absolute; inset: 0; background: #000; color: var(--dim);
    display: flex; align-items: center; justify-content: center; font-size: 15px; z-index: 5; }

  .memory { border: 2px solid var(--gold); background: #1a1710; padding: 16px; margin-top: 18px; }
  .mem-head { color: var(--gold); font-size: 12px; letter-spacing: 3px; margin-bottom: 8px; }
  .mem-title { font-weight: bold; margin-top: 8px; }
  .mem-text { font-size: 14px; margin-top: 4px; line-height: 1.7; }
  .mem-foot { color: var(--dim); margin-top: 10px; font-size: 13px; }

  .mail { border: 2px solid var(--line); background: #f4f2ea; color: #222; margin-bottom: 14px; }
  .mail-bar { background: #2a3140; color: #dde; font-size: 12px; padding: 6px 10px; }
  .mail-body { padding: 11px 13px; font-size: 15px; min-height: 56px; }
  .mail-fixed { font-weight: bold; }
  .cursor { animation: blink .8s infinite; }

  .tear-wrap { text-align: center; margin-top: 4vh; display: flex; flex-direction: column; gap: 14px; }
  .pix-face { font-size: 40px; }
  .stamp { font-size: 26px; font-weight: bold; color: var(--red); border: 3px solid var(--red);
    display: inline-block; padding: 8px 18px; margin: 14px auto 0; transform: rotate(-4deg); }

  .lastcount { text-align: center; margin-top: 10vh; }
  .lc-clock { color: var(--dim); font-size: 18px; letter-spacing: 2px; }
  .lc-num { font-size: 32px; font-weight: bold; color: var(--gold); margin-top: 14px;
    font-variant-numeric: tabular-nums; }

  /* 結果画面の締めの一行（旧・青い総額画面のコピーをここへ移した） */
  .verdict-copy { font-size: 19px; font-weight: bold; line-height: 1.7; margin-top: 16px; }
  .retry-q { text-align: center; margin-top: 26px; color: var(--text); }

  /* 小さいiPhoneでも9行が1画面に収まる高さ（収まらないと下の行が読まれない） */
  .ranks { margin-top: 1vh; }
  .rank-rows { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; }
  .rank-row { display: flex; justify-content: space-between; border-bottom: 1px solid var(--line);
    padding: 5px 4px; font-size: 15px; }
  .rank-v { color: var(--gold); font-weight: bold; }
  .munedo { text-align: center; margin-top: 8vh; }
  .munedo-main { font-size: 22px; font-weight: bold; color: var(--gold); }
  .munedo-sub { color: var(--dim); margin-top: 8px; font-size: 13px; }
  /* 「何を評価されたのか」を1行で。総合ランクとの違いをここで切り分ける */
  .munedo-note { color: var(--dim); font-size: 11px; line-height: 1.6; margin-top: 5px; }
  .lastword { margin-top: 18px; font-size: 16px; }

  /* タイトルの案内。押せると分かる程度に立てるが、はじめからより前には出ない */
  .title-lp { background: none; border: 1px solid var(--line); color: var(--dim);
    font-family: inherit; font-size: 12px; letter-spacing: 1px; margin-top: 14px;
    cursor: pointer; padding: 8px 14px; border-radius: 2px; align-self: center; }
  .title-lp:active { border-color: var(--gold); color: var(--gold); }
  /* エンディング後の案内。ゲームの画面ではなく「挟み込まれた紙」に見せる。
     配色・明朝・マーカーは案内ページ側のデザインを踏襲 */
  .contena-card { background: #fbf7ef; color: #16130f; border: 1px solid #e0d6c2;
    padding: 20px 18px 16px; text-align: center; image-rendering: auto;
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
  .cc-lead { font-size: 12px; color: #8f0a20; letter-spacing: 2px; }
  .cc-head { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 21px; font-weight: bold; line-height: 1.55; margin-top: 8px; }
  /* 用途は必ず2段×2個。画面幅で3+1に割れると、並びが毎回変わって落ち着かない */
  .cc-uses { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 14px 0 12px; }
  .cc-uses span { border: 1px solid #e0d6c2; background: #f4ecdd; color: #4a423a;
    font-size: 12px; padding: 6px 4px; text-align: center; }
  .cc-body { font-size: 13px; line-height: 1.85; color: #4a423a; }
  /* 2行目は必ず1行。折り返すとマーカーが2段に割れて締まらないので、
     幅に合わせて級数を落とす（320pxの端末まで1行を守る） */
  .cc-1line { display: block; white-space: nowrap; font-size: min(3.25vw, 13px); }
  /* LPと同じ黄色のマーカー */
  .cc-mk { color: #16130f; background: linear-gradient(transparent 58%, #ffe95c 58%,
    #ffe95c 94%, transparent 94%); font-weight: bold; }
  .cc-btn { display: block; width: 100%; margin: 16px 0 0; padding: 14px;
    background: #c8102e; color: #fff; border: none; border-radius: 3px;
    font-family: inherit; font-size: 16px; font-weight: bold; letter-spacing: 1px;
    cursor: pointer; box-shadow: 0 3px 0 #8f0a20; }
  .cc-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #8f0a20; }
  .cc-note { color: #8a8378; font-size: 11px; margin-top: 7px; }
  .epi-words { text-align: center; margin-top: 10vh; font-size: 18px; letter-spacing: 2px; line-height: 2.2; }

  /* iPhone 13 mini などの短い画面。本文の型は2行になるので、選択肢が4つ並ぶと
     メルマガ作成の枠が押し出されて「いま選んだ件名」が見えなくなる。
     詰めるのは余白と絵の高さだけ＝文字は小さくしない */
  @media (max-height: 700px) {
    #art { max-height: 14vh; }
    #stage { padding: 10px 16px; }
    #choices { padding: 2px 14px 5px; gap: 4px; }
    .choice { padding: 7px 12px; line-height: 1.45; }
    .mail { margin-bottom: 7px; }
    .mail-body { padding: 6px 13px; min-height: 34px; }
    .mail-bar { padding: 3px 10px; font-size: 11px; }
    .mail-subj { line-height: 1.5; }
    .send-wrap { margin-top: 1vh; gap: 8px; }
    .textbox { line-height: 1.75; }
    .center { margin-top: 4vh; }
    .munedo { margin-top: 4vh; }
  }
  .clear-wrap { text-align: center; margin-top: 6vh; display: flex; flex-direction: column; gap: 16px; }
  .game-clear { font-size: 34px; font-weight: bold; color: var(--gold); letter-spacing: 6px;
    text-shadow: 3px 3px 0 #4a3a08; }
  .clear-next { color: var(--dim); }
  .clear-sub { color: var(--dim); font-size: 14px; letter-spacing: 1px; margin-top: 4px; }
  .kizpt .tline { color: var(--gold); font-weight: bold; font-size: 18px; }
  .game-over { font-size: 32px; font-weight: bold; color: var(--red); letter-spacing: 5px;
    text-shadow: 3px 3px 0 #3a1010; }
  .notyet-lines { font-size: 16px; line-height: 2; margin-top: 6px; }
  /* 史実との差額。ここが一番読まれる場所なので、金額を主役にする */
  .gap-board { margin: 18px auto 10px; max-width: 330px; border: 1px solid var(--line);
    background: #11151d; padding: 9px 12px; }
  .gap-row { display: flex; justify-content: space-between; align-items: baseline;
    gap: 14px; font-size: 12px; color: var(--dim); padding: 3px 0; white-space: nowrap; }
  .gap-row b { font-size: 17px; color: var(--fg); font-variant-numeric: tabular-nums; }
  .gap-row + .gap-row { border-top: 1px solid var(--line); }
  .gap-big { font-size: 16px; margin-top: 12px; }
  .gap-big b { font-size: 27px; font-variant-numeric: tabular-nums; }
  .gap-big.lose { color: var(--red); }
  .gap-big.win { color: var(--gold); }
  .shime { font-size: 16px; } .shime.big { font-size: 24px; font-weight: bold; }
</style>
</head>
<body>
<div id="app">
  <button id="menu-btn" title="メニュー">☰</button>
  <div id="hud">
    <div class="hud-top">
      <span class="hud-counts">
        <span id="hud-buyers">フロント 0本</span>
        <span id="hud-upsell">アップセル 0本</span>
      </span>
      <span class="hud-money">
        <span class="hud-sales-row">
          <span class="hud-sales-label">総売上</span>
          <span id="hud-sales">0円</span>
        </span>
        <span id="hud-remain">史実まで、あと 5億6490万円</span>
      </span>
    </div>
    <div class="hud-gauge-row">
      <span class="g-list">見込み客</span>
      <div class="gauge" id="gauge-list"><div id="gauge-fill"></div></div>
      <span id="hud-list">45,000人</span>
    </div>
    <div class="hud-gauge-row hud-trio">
      <span class="g-mental">メンタル</span>
      <div class="gauge" id="gauge-mental"><div id="mental-fill"></div></div>
      <span class="g-trust">信用</span>
      <div class="gauge" id="gauge-trust"><div id="trust-fill"></div></div>
      <span class="g-rikai">顧客理解</span>
      <div class="gauge" id="gauge-rikai"><div id="rikai-fill"></div></div>
    </div>
  </div>
  <div id="artwrap">
    <canvas id="art" width="360" height="200"></canvas>
  </div>
  <div id="timebar"><span id="hud-clock">セールス終了まで、あと12時間</span></div>
  <div id="stage"></div>
  <div id="choices"></div>
  <div id="spacer"></div>
</div>
<script src="js/data.js?v=202608120224"></script>
<script src="js/art.js?v=202608120224"></script>
<script src="js/scenes1.js?v=202608120224"></script>
<script src="js/scenes2.js?v=202608120224"></script>
<script src="js/scenes3.js?v=202608120224"></script>
<script src="js/scenes4.js?v=202608120224"></script>
<script src="js/sfx.js?v=202608120224"></script>
<script src="js/game.js?v=202608120224"></script>
</body>
</html>
